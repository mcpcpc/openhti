<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="author" content="Michael Czigler">
    <meta name="description" content="Lightweight hardware test framework">
    <meta name="theme-color" content="#5B4FE9">
    <title>Login · OpenHTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='main.css') }}?v={{ static_mtime('main.css') }}" rel="stylesheet">
    <script>
      (function(){
        var t = localStorage.getItem('app-theme') || 'auto';
        var r = t === 'auto' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.setAttribute('data-theme', r);
        document.documentElement.setAttribute('data-stored-theme', t);
      })();
    </script>
  </head>
  <body>
    <button class="login-theme btn btn-ghost btn-icon" onclick="cycleTheme()" aria-label="Toggle theme"
      style="position:fixed;top:16px;right:16px;z-index:10">
      <svg class="theme-icon-light" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/></svg>
      <svg class="theme-icon-dark" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      <svg class="theme-icon-auto" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v1H7v2h10v-2h-1v-1h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
    </button>

    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
              <use href="{{ url_for('static', filename='keen-icons.svg') }}#abstract-48"></use>
            </svg>
          </div>
          <span class="brand-name">OpenHTI</span>
        </div>

        <h1 class="login-title">Sign in</h1>
        <p class="login-sub">Enter your application password to continue.</p>

        {% with messages = get_flashed_messages() %}
        <form id="validate" action="{{ url_for('.validate') }}" method="post">
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password"
                   class="form-control{% if messages %} is-invalid{% endif %}"
                   id="password" name="password"
                   placeholder="••••••••"
                   autofocus required
                   autocomplete="current-password">
            {% if messages %}
            {% for message in messages %}
            <div class="invalid-feedback">{{ message }}</div>
            {% endfor %}
            {% endif %}
          </div>
          <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top:var(--s4)">
            Sign in
          </button>
        </form>
        {% endwith %}

        <div class="login-footer">
          <a href="{{ url_for('automatic.read') }}">← Back to home</a>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
